name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and lint tool
        run: python -m pip install -e . ruff==0.11.12
      - name: Lint
        run: ruff check .
      - name: Run hermetic tests with warnings as errors
        run: python -W error::ResourceWarning -m unittest discover -s tests -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source and wheel artifacts
        run: python -m pip install build && python -m build
      - name: Install and smoke-test the wheel
        run: python -m pip install dist/*.whl && anvil-events --help

  compose-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prove convergence and broker-loss catch-up
        run: python tools/compose_smoke.py --project anvil-events-ci
      - name: Prove mTLS identity mapping and negative ACLs
        run: python -m tools.fleet_tls_smoke
