[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-events"
version = "0.1.0"
description = "Fleet lifecycle event bus and journal for the Anvil family (stdlib-only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "fakoli" }]
dependencies = []   # stdlib-only by design

[project.optional-dependencies]
dev = ["pytest", "coverage>=7.6", "ruff==0.11.12"]

[tool.ruff]
# Explicit rule scope (mirrors anvil-serving practice): do not rely on
# version-specific default rule sets. `E4/E7/E9/F` (pyflakes + select pycodestyle),
# `I` (isort), `UP` (pyupgrade), `B` (bugbear) are stable, high-value rules.
# `BLE001`/`S110` are intentionally NOT enabled: this codebase is a stdlib-only
# event client where bounded `except Exception` around a socket/outbox boundary
# is the correct degraded-mode behavior (see nats_mini/cli/daemon).
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[project.scripts]
anvil-events = "anvil_events.cli:main"

[tool.setuptools.packages.find]
include = ["anvil_events*"]
