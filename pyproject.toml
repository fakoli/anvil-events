[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anvil-events"
version = "0.2.0"
description = "Local-first desired-state convergence events for small fleets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "fakoli" }]
dependencies = []   # stdlib-only by design

[project.optional-dependencies]
dev = ["coverage>=7.6", "jsonschema[format]>=4.23", "ruff==0.11.12"]

[tool.ruff]
# Explicit rule scope (mirrors anvil-serving practice): do not rely on
# version-specific default rule sets. `E4/E7/E9/F` (pyflakes + select pycodestyle),
# `I` (isort), `UP` (pyupgrade), `B` (bugbear) are stable, high-value rules.
# `BLE001`/`S110` are intentionally NOT enabled: this codebase is a stdlib-only
# event client where bounded `except Exception` around a socket/outbox boundary
# is the correct degraded-mode behavior around bounded transport/storage edges.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[project.scripts]
anvil-events = "anvil_events.cli:main"

[tool.setuptools.packages.find]
include = ["anvil_events*"]

[tool.setuptools.data-files]
"share/anvil-events/schemas" = ["schemas/events-v1.json", "schemas/events-v2.json"]
"share/anvil-events/deploy" = [
  "deploy/development-node.toml",
  "deploy/fleet-node.example.toml",
  "deploy/nats-fleet.example.conf",
  "deploy/nats-stream.json",
]
"share/anvil-events/deploy/artifacts/routing/clients" = [
  "deploy/artifacts/routing/clients/rev-1",
]
