# Fleet template only. Keep real identities, addresses, and credential values
# in the private operator repository. NATS expands the referenced environment
# variables at runtime; no secret value belongs in this file.

listen: "0.0.0.0:4222"

jetstream {
  store_dir: "/var/lib/nats/jetstream"
}

tls {
  cert_file: $ANVIL_EVENTS_NATS_SERVER_CERT
  key_file: $ANVIL_EVENTS_NATS_SERVER_KEY
  ca_file: $ANVIL_EVENTS_NATS_CA
  handshake_first: true
  verify_and_map: true
}

authorization {
  users: [
    {
      user: "node-a"
      permissions: {
        publish: [
          "anvil.events.v2.node-a.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.ANVIL_EVENTS.node-a-events",
          "$JS.ACK.ANVIL_EVENTS.node-a-events.>"
        ]
        subscribe: ["_INBOX.>", "anvil.delivery.node-a-events"]
      }
    },
    {
      user: "node-b"
      permissions: {
        publish: [
          "anvil.events.v2.node-b.>",
          "$JS.API.CONSUMER.DURABLE.CREATE.ANVIL_EVENTS.node-b-events",
          "$JS.ACK.ANVIL_EVENTS.node-b-events.>"
        ]
        subscribe: ["_INBOX.>", "anvil.delivery.node-b-events"]
      }
    },
    {
      user: "stream-admin"
      permissions: {
        publish: ["$JS.API.>"]
        subscribe: ["_INBOX.>"]
      }
    }
  ]
}
